const list=document.getElementById('list');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function factClass(v){ if(v.startsWith('OK'))return 'ok'; if(v.startsWith('NG'))return 'no'; return 'fix'; }
function render(){
 const q=document.getElementById('q').value.trim().toLowerCase();
 const active=document.querySelector('.chip.active')?.dataset.filter||'all';
 list.innerHTML='';
 machines.filter(m=>{
   const text=JSON.stringify(m).toLowerCase();
   const qok=!q||text.includes(q);
   const fok=active==='all'||m.filters.includes(active);
   return qok&&fok;
 }).forEach(m=>{
   const el=document.createElement('article');el.className='machine';
   const gradeClass=m.grade==='S+'?'grade gsp':'grade';
   el.innerHTML=`
    <div class="machine-head" role="button" tabindex="0" aria-expanded="false">
      <div class="rank">${m.rank}</div>
      <div class="machine-title"><strong>${esc(m.name)}</strong><span>${esc(m.short)}｜空き台実用性ランキング</span></div>
      <div class="${gradeClass}">${esc(m.grade)}</div>
    </div>
    <div class="quick">${m.tags.map((t,i)=>`<span class="tag ${i===0?'good':''}">${esc(t)}</span>`).join('')}</div>
    <div class="detail">
      <div class="block"><h3>巡回時に見る順番</h3><div class="steps">${m.quick.map(x=>`<div class="step">${esc(x)}</div>`).join('')}</div></div>
      <div class="block"><h3>空き台から取れる情報</h3><div class="truth">
        <div class="a"><b>A｜直接確認</b><p>${esc(m.direct)}</p></div>
        <div class="b"><b>B｜履歴で復元</b><p>${esc(m.restore)}</p></div>
        <div class="c"><b>C｜条件付き推測</b><p>${esc(m.infer)}</p></div>
        <div class="d"><b>D｜復元しない</b><p>${esc(m.impossible)}</p></div>
      </div></div>
      <div class="block"><h3>プロジェクトA候補ライン</h3><div class="linebox"><b>目安：</b> ${esc(m.line)}</div></div>
      <div class="block"><h3>やめ時・状態変化</h3><div class="linebox">${esc(m.quit)}</div></div>
      <div class="block"><h3>誤判定防止</h3><div class="caution">${esc(m.caution)}</div></div>
      <div class="block"><h3>ファクトチェック</h3><table class="fact-table">${m.facts.map(([a,b])=>`<tr><td>${esc(a)}</td><td class="${factClass(b)}">${esc(b)}</td></tr>`).join('')}</table></div>
      <div class="copyrow"><button class="copybtn" data-copy="${esc(m.input)}">相談文をコピー</button><button class="copybtn" data-copy="${esc(m.short)} 不明">最小入力をコピー</button></div>
    </div>`;
   const head=el.querySelector('.machine-head');
   function toggle(){el.classList.toggle('open');head.setAttribute('aria-expanded',el.classList.contains('open'))}
   head.addEventListener('click',toggle);head.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
   list.appendChild(el);
 });
 document.querySelectorAll('[data-copy]').forEach(btn=>btn.addEventListener('click',async()=>{
   try{await navigator.clipboard.writeText(btn.dataset.copy);const old=btn.textContent;btn.textContent='コピーしました';setTimeout(()=>btn.textContent=old,1200)}catch{prompt('コピーしてください',btn.dataset.copy)}
 }));
}
document.getElementById('q').addEventListener('input',render);
document.getElementById('filters').addEventListener('click',e=>{if(!e.target.matches('.chip'))return;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');render()});
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
